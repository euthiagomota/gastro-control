# ====================================================
# Docker Profile Configuration
# Overrides for Docker environment
# ====================================================

spring:
  # ====================================================
  # DATABASE - Docker Network
  # ====================================================
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/gastrocontrol}
    username: ${DB_USERNAME:gastrocontrol}
    password: ${DB_PASSWORD:gastrocontrol123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  # ====================================================
  # JPA / HIBERNATE - Docker optimized
  # ====================================================
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 20

  # ====================================================
  # FLYWAY - Docker migrations
  # ====================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
    connect-retries: 60
    connect-retries-interval: 1

# ====================================================
# LOGGING - Docker verbose
# ====================================================
logging:
  level:
    root: WARN
    com.gastrocontrol: INFO
    org.springframework.boot: INFO
    org.flywaydb: INFO
    org.postgresql.jdbc: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ====================================================
# ACTUATOR - Full health info
# ====================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
    diskspace:
      enabled: true

